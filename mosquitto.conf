# ─────────────────────────────────────────────
# Cấu hình Mosquitto MQTT Broker — DÙNG CHO MÔI TRƯỜNG DEV/LOCAL
#
# LƯU Ý QUAN TRỌNG: file này cho phép kết nối "anonymous" (không cần
# username/password) để đơn giản hóa việc học và debug ở giai đoạn dev.
# Trong môi trường production thật, PHẢI bật authentication + TLS,
# không bao giờ để allow_anonymous true trên broker public.
# ─────────────────────────────────────────────

# Cho phép client kết nối không cần xác thực (chỉ dùng cho dev)
allow_anonymous true

# Lắng nghe kết nối MQTT chuẩn trên port 1883
listener 1883

# Lắng nghe thêm qua WebSocket trên port 9001
# (hữu ích nếu sau này muốn dashboard React kết nối MQTT trực tiếp qua trình duyệt)
listener 9001
protocol websockets

# Ghi log ra file bên trong container, map ra ngoài qua volume mosquitto-log
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Lưu message persistent (để không mất message nếu container restart)
persistence true
persistence_location /mosquitto/data/
# Local infrastructure: SQL Server 2022 + Mosquitto MQTT broker.
# Usage: cp .env.example .env && docker compose up -d && docker compose ps
# M4b: the plant side (machine simulator + edge gateway) is the "plant" profile, so the usual "up -d" does not clash
# with a simulator started by "dotnet run" (ports 4840/5020, MQTT client ids):
#   docker compose --profile plant up -d --build
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mes-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # "Up" is not "ready": this waits until SQL Server actually accepts a login.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mes-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # M4b: the machines. MQTT machines talk to the broker; the reflow oven is an OPC UA server (4840) and the glue
  # dispenser a Modbus TCP slave (5020), read by the gateway below. The station role calls the API on the host.
  simulator:
    profiles: ["plant"]
    build:
      context: .
      dockerfile: docker/simulator.Dockerfile
    container_name: mes-simulator
    environment:
      mqtt__host: mosquitto
      api__baseUrl: http://host.docker.internal:5157
      # The URL the OPC UA server announces must resolve for its clients (spec 2.2, trap 1): the service name.
      machines__1__opcua__host: simulator
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4840:4840"   # UaExpert from the host: opc.tcp://localhost:4840
      - "5020:5020"
    stdin_open: true  # console commands: docker attach mes-simulator
    tty: true
    depends_on:
      mosquitto:
        condition: service_healthy

  # M4b: OPC UA + Modbus -> MQTT, with the SQLite outbox and the OPC UA certificates on volumes.
  gateway:
    profiles: ["plant"]
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    container_name: mes-gateway
    environment:
      mqtt__host: mosquitto
      devices__0__endpoint: opc.tcp://simulator:4840
      devices__1__host: simulator
      opcUa__autoAcceptUntrustedCertificates: "true"   # dev only: production trusts the PLC certificate by hand
    volumes:
      - gateway-data:/app/data
      - gateway-pki:/app/pki
    depends_on:
      mosquitto:
        condition: service_healthy
      simulator:
        condition: service_started

volumes:
  mssql-data:
  mosquitto-data:
  gateway-data:
  gateway-pki:
